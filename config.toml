baseURL = "https://thetenderforlaw.com/"
languageCode = "en-us"
title = "The Tender For Law"
# robots.txt (layouts/robots.txt) points search engines at the sitemap.
enableRobotsTXT = true

[params]
# The site's description for search engines and link previews: the home page, and pages without their own
# (layouts/partials/seo-meta.html).
description = "An archive of THE TENDER FOR LAW Facebook group, 2013 to 2018: its posts and comments on surety, accounting, agency, bills of exchange, insurance and title, with articles by its members and a library of the books behind them."
# Telegram comments at the bottom of the home page (layouts/index.html). Get the ID by connecting
# https://rygoy.github.io at https://comments.app (log in with Telegram). Empty hides the section.
comments_app_website = ""

# The commentary bot (telegram-bot/README.md). With commentary_telegram = true, "Add commentary" opens the bot, by its
# Telegram username (without the @), on the page; with false, it opens GitHub's editor with a new note instead. This
# switches the site's link only: to stop the bot itself, see "Turning it off" in telegram-bot/README.md.
commentary_telegram = true
commentary_telegram_bot = "CommentaryTTFLbot"

# The neon sign on the home page's cdd.com button (layouts/partials/body.html): lit only while the show is on, on
# live_sign_day from live_sign_from to live_sign_to, Toronto time (EST, or EDT in summer), and off the rest of the
# week. live_sign = false leaves it out; live_sign_text is what it says. Days are Mon, Tue, Wed, Thu, Fri, Sat, Sun.
live_sign = true
live_sign_text = "LIVE 20:00 EST Thursdays"
live_sign_day = "Thu"
live_sign_from = "20:00"
live_sign_to = "23:00"
# Before it, from live_standby_from until live_sign_from on the same day, a blue sign flashing slowly says
# live_standby_text. live_standby = false leaves the blue sign out (live_sign = false leaves out both).
live_standby = true
live_standby_text = "Standby"
live_standby_from = "19:45"

# Link previews (Open Graph / Twitter tags in partials/head.html) for pages with nothing of their own: the Grand
# Fluff Auto pop-up's picture and text. partials/footer.html shows the same picture in the pop-up.
[params.preview]
image = "images/grand-fluff-auto.jpg"
image_width = 768
image_height = 1360
image_alt = "Grand Fluff Auto cover art: a girl with long dark hair in a school uniform stands between two men under the Grand Fluff Auto Five logo."
description = "Grand Fluff Auto: you will need the FiveM client installed along with a licensed copy of GTAV from the Steam store. If you have all of these, the link loads the game and drops you into the server."
