<svg xmlns="http://www.w3.org/2000/svg" width="298" height="298" viewBox="0 0 298 298">
<!-- Robertson Ancient (Clan Donnachaidh) tartan, in the Ancient colours of Scotclans' swatch (scotclans.com/blogs/clan-r/robertson-tartans):
     R/4 G3 R31 G3 R3 B31 R3 G31 R3 B3 R31 G3 R/4, one unit per thread. Warp drawn whole, weft over it in a 2/2 twill
     (diagonal bands, two threads on, two off). The light theme's copy, at about twice the strength of robertson.svg so it shows on the pale sidebar (static/css/archive.css). -->
