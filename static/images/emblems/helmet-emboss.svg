<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 432 500">
  <!-- The original bounty hunter's helmet, front on, embossed, for the carousel cards in the Dark theme (archive.css,
       .carousel-frame::before). Drawn from a straight-on photograph of the helmet. The shapes are a height map in grey
       (lighter is higher; each covers what is under it): the shell, the brow band and cheek plates proud of it, the
       ear pieces and rangefinder highest, the dent, the jaw's lower panels and the T visor sunk. The filter lights it
       from the top left. Flat ground comes out exactly mid grey, so with mix-blend-mode: soft-light only the relief
       shows, in the card's own colour. Flat fills only: gradients band once lit. -->
  <defs>
    <filter id="emboss" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="luminanceToAlpha" result="map"/>
      <feGaussianBlur in="map" stdDeviation="3.2" result="height"/>
      <!-- elevation 30: a flat surface gets sin(30) = 0.5, mid grey. -->
      <feDiffuseLighting in="height" surfaceScale="7" diffuseConstant="1" lighting-color="#fff">
        <feDistantLight azimuth="225" elevation="30"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <g filter="url(#emboss)">
    <rect x="40" width="432" height="500" fill="#000"/>
    <!-- Shell: a broad dome down to the brow, then the face, its foot tapering in to the visor's stem. -->
    <path fill="#a8a8a8" d="M108 236C106 158 178 108 256 108C334 108 406 158 404 236L426 248V424L392 444L352 464L312 484L290 492H222L200 484L160 464L120 444L86 424V248Z"/>
    <!-- The dent, high on the dome to the viewer's right. -->
    <ellipse cx="330" cy="146" rx="28" ry="16" fill="#8e8e8e" transform="rotate(26 330 146)"/>
    <!-- Brow band, across the foot of the dome above the visor. -->
    <path fill="#c0c0c0" d="M106 218Q256 210 406 218L408 238H104Z"/>
    <!-- Cheek plates: the face either side of the stem, down to the jaw. -->
    <path fill="#c8c8c8" d="M88 262H424V422L392 440L352 460L312 480L290 488H222L200 480L160 460L120 440L88 422Z"/>
    <!-- The jaw's lower panels, a step down from the cheeks, curving in towards the stem. -->
    <path fill="#b4b4b4" d="M88 340C118 372 168 412 208 448L200 480L160 460L120 440L88 422Z"/>
    <path fill="#b4b4b4" d="M424 340C394 372 344 412 304 448L312 480L352 460L392 440L424 422Z"/>
    <!-- The T visor, sunk into the face: a thin bar below the brow, its foot dipping to the stem, which runs to the chin. -->
    <path fill="#262626" d="M110 238H402L400 268L288 278V492H224V278L112 268Z"/>
    <!-- Ear pieces: the large one on the viewer's left, carrying the rangefinder, and a small one on the right. -->
    <rect x="68" y="206" width="46" height="176" rx="8" fill="#d8d8d8"/>
    <rect x="80" y="292" width="22" height="34" rx="4" fill="#bcbcbc"/>
    <rect x="412" y="236" width="20" height="170" rx="6" fill="#d0d0d0"/>
    <!-- Rangefinder: the stalk straight up from the left ear piece, its head a flat box over the dome, pointing in. -->
    <path fill="#e6e6e6" d="M96 210V50H110V210Z"/>
    <path fill="#f2f2f2" d="M84 14L182 18C186 18 188 21 188 25V40L152 48L124 62L90 58C86 58 84 55 84 51Z"/>
    <path fill="#b8b8b8" d="M124 44H176L152 52L128 58Z"/>
  </g>
</svg>
