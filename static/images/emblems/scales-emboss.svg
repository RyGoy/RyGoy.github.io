<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.5 -38 525 620">
  <!-- Unbalanced scales, embossed, for the carousel cards in the Light theme (archive.css, .carousel-frame::before):
       a balance on its pillar and stepped foot, the beam tipped down to the left, its heavy pan hanging low and the
       empty one riding high. Drawn for this site. A height map in grey (lighter is higher), lit by the same filter as
       helmet-emboss.svg and jolly-roger-emboss.svg, so flat ground is mid grey and with mix-blend-mode: soft-light
       only the relief shows. Flat fills only. The viewBox leaves the same margin as the Jolly Roger's. -->
  <defs>
    <filter id="emboss" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="luminanceToAlpha" result="map"/>
      <feGaussianBlur in="map" stdDeviation="3.2" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="7" diffuseConstant="1" lighting-color="#fff">
        <feDistantLight azimuth="225" elevation="30"/>
      </feDiffuseLighting>
    </filter>
    <!-- A pan hanging from (0, 0): three chains to a shallow dish 150 wide, 120 below. -->
    <g id="pan">
      <path fill="none" stroke="#7a7a7a" stroke-width="5" d="M0 0L-72 120M0 0L0 120M0 0L72 120"/>
      <path fill="#a0a0a0" d="M-80 118L80 118C72 150 40 162 0 162C-40 162 -72 150 -80 118Z"/>
      <circle r="9" fill="#a8a8a8"/>
    </g>
  </defs>
  <g filter="url(#emboss)">
    <rect x="-12.5" y="-38" width="525" height="620" fill="#000"/>
    <!-- Foot, two steps. -->
    <path fill="#8c8c8c" d="M120 520L380 520L362 492L138 492Z"/>
    <path fill="#9a9a9a" d="M168 492L332 492L318 468L182 468Z"/>
    <!-- Pillar, swelling at its base, with a finial on top. -->
    <path fill="#a8a8a8" d="M236 468L264 468L258 120L242 120Z"/>
    <circle cx="250" cy="96" r="20" fill="#b4b4b4"/>
    <path fill="#b4b4b4" d="M250 52L262 76L238 76Z"/>
    <!-- Beam, pivoting at (250, 120), tipped 14 degrees down to the left. -->
    <g transform="rotate(-14 250 120)">
      <path fill="#b0b0b0" d="M70 112L430 112L436 120L430 128L70 128L64 120Z"/>
    </g>
    <circle cx="250" cy="120" r="14" fill="#c0c0c0"/>
    <!-- Pans from the beam's ends, (75, 164) low and (425, 76) high; the low one holds a heap. -->
    <use href="#pan" transform="translate(75 164)"/>
    <path fill="#b8b8b8" d="M25 284C35 256 60 248 75 250C92 248 116 258 125 284Z"/>
    <use href="#pan" transform="translate(425 76)"/>
  </g>
</svg>
