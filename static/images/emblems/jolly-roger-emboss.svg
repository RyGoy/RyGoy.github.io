<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.5 -38 525 620">
  <!-- A Jolly Roger, embossed, for the carousel cards in the Sepia theme (archive.css, .carousel-frame::before): a
       skull front on above two crossed bones. Drawn for this site, after the common doodle of one. The shapes are a
       height map in grey (lighter is higher; each covers what is under it). The skull carries the relief: a heavy brow
       scowling down to the centre, cheekbones proud over gaunt hollows, the temples drawn in, a crack down the crown,
       and deep eye sockets angled in to the nose, each with a darker hollow at its core; the nose and the gaps between
       the long teeth sunk. The bones lie low behind it, so they show faintly. The filter lights it from the top left.
       Flat ground comes out exactly mid grey, so with mix-blend-mode: soft-light only the relief shows, in the card's
       own colour. Flat fills only: gradients band once lit. Same filter as helmet-emboss.svg. The viewBox leaves a
       margin round the drawing (a quarter of its size), which sets how large it is on the card. -->
  <defs>
    <filter id="emboss" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="luminanceToAlpha" result="map"/>
      <feGaussianBlur in="map" stdDeviation="3.2" result="height"/>
      <!-- elevation 30: a flat surface gets sin(30) = 0.5, mid grey. -->
      <feDiffuseLighting in="height" surfaceScale="7" diffuseConstant="1" lighting-color="#fff">
        <feDistantLight azimuth="225" elevation="30"/>
      </feDiffuseLighting>
    </filter>
    <!-- A bone along the x-axis, centred: the shaft, and two knobs at each end, either side of it. -->
    <g id="bone">
      <rect x="-172" y="-12" width="344" height="24" rx="12"/>
      <circle cx="-186" cy="-14" r="20"/><circle cx="-186" cy="14" r="20"/>
      <circle cx="186" cy="-14" r="20"/><circle cx="186" cy="14" r="20"/>
    </g>
  </defs>
  <g filter="url(#emboss)">
    <rect x="-12.5" y="-38" width="525" height="620" fill="#000"/>
    <!-- Crossed bones under the jaw, crossing at (250, 404), lying low; the one rising to the right on top. -->
    <use href="#bone" fill="#5c5c5c" transform="translate(250 404) rotate(27)"/>
    <use href="#bone" fill="#686868" transform="translate(250 404) rotate(-27)"/>
    <!-- Lower jaw, a little below the face, long and narrowing. -->
    <path fill="#9a9a9a" d="M180 292C178 332 206 366 250 368C294 366 322 332 320 292Z"/>
    <!-- Cranium and face: a broad dome, the temples drawn in, cheekbones out, down to the upper teeth. -->
    <path fill="#a8a8a8" d="M146 214C128 118 180 44 250 44C320 44 372 118 354 214C362 232 356 252 340 262C330 268 322 278 318 294L182 294C178 278 170 268 160 262C144 252 138 232 146 214Z"/>
    <!-- Temples, sunk. -->
    <path fill="#909090" d="M156 146C146 176 148 210 160 232C168 208 170 176 166 150Z"/>
    <path fill="#909090" d="M344 146C354 176 352 210 340 232C332 208 330 176 334 150Z"/>
    <!-- A crack down the crown, right of centre. -->
    <path fill="#545454" d="M266 46L271 47L265 80L280 103L271 136L267 135L275 104L260 81Z"/>
    <!-- Brow: heavy, scowling down to a point between the eyes. -->
    <path fill="#d2d2d2" d="M158 188C186 172 224 182 246 206L254 206C276 182 314 172 342 188L340 206C312 194 280 202 258 224L242 224C220 202 188 194 160 206Z"/>
    <!-- Cheekbones, proud, and the gaunt hollows under them. -->
    <path fill="#c4c4c4" d="M150 234C162 250 186 256 206 256C198 268 178 272 162 266C150 260 144 248 150 234Z"/>
    <path fill="#c4c4c4" d="M350 234C338 250 314 256 294 256C302 268 322 272 338 266C350 260 356 248 350 234Z"/>
    <path fill="#868686" d="M164 268C178 274 188 284 192 296L182 296C178 286 172 278 164 268Z"/>
    <path fill="#868686" d="M336 268C322 274 312 284 308 296L318 296C322 286 328 278 336 268Z"/>
    <!-- Eye sockets, deep and angled in to the nose, each with a darker hollow at its core. -->
    <path fill="#262626" d="M170 212C194 198 228 208 242 228C242 250 226 262 204 260C182 258 168 240 170 212Z"/>
    <path fill="#262626" d="M330 212C306 198 272 208 258 228C258 250 274 262 296 260C318 258 332 240 330 212Z"/>
    <ellipse cx="208" cy="236" rx="19" ry="13" fill="#0a0a0a"/>
    <ellipse cx="292" cy="236" rx="19" ry="13" fill="#0a0a0a"/>
    <!-- Nose: an upturned heart, deep, split by its septum. -->
    <path fill="#1c1c1c" d="M250 236C242 246 233 260 233 273C233 283 243 286 250 278C257 286 267 283 267 273C267 260 258 246 250 236Z"/>
    <rect x="248.5" y="256" width="3" height="24" fill="#5a5a5a"/>
    <!-- The mouth: the dark gap the teeth stand in, then the long upper and lower teeth. -->
    <rect x="186" y="284" width="128" height="52" rx="10" fill="#363636"/>
    <g fill="#bcbcbc">
      <rect x="190" y="286" width="12" height="22" rx="3"/><rect x="203.5" y="286" width="12" height="24" rx="3"/>
      <rect x="217" y="286" width="12" height="25" rx="3"/><rect x="230.5" y="286" width="12" height="26" rx="3"/>
      <rect x="244" y="286" width="12" height="26" rx="3"/><rect x="257.5" y="286" width="12" height="26" rx="3"/>
      <rect x="271" y="286" width="12" height="25" rx="3"/><rect x="284.5" y="286" width="12" height="24" rx="3"/>
      <rect x="298" y="286" width="12" height="22" rx="3"/>
    </g>
    <g fill="#b0b0b0">
      <rect x="196" y="314" width="12" height="19" rx="3"/><rect x="209.5" y="315" width="12" height="19" rx="3"/>
      <rect x="223" y="315" width="12" height="20" rx="3"/><rect x="236.5" y="315" width="12" height="20" rx="3"/>
      <rect x="250" y="315" width="12" height="20" rx="3"/><rect x="263.5" y="315" width="12" height="20" rx="3"/>
      <rect x="277" y="315" width="12" height="19" rx="3"/><rect x="290.5" y="314" width="12" height="19" rx="3"/>
    </g>
  </g>
</svg>
