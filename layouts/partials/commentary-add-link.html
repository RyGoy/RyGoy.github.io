{{/* "Add commentary" and, with the commentary bot on, "Ask a question"; the addresses come from
     partials/commentary-links.html. */}}
{{ $links := partial "commentary-links.html" . }}
{{ if $links.ask }}
<a class="commentary-add" href="{{ $links.add }}" target="_blank" rel="noopener noreferrer">Add commentary <span aria-hidden="true">↗</span></a>
<a class="commentary-add" href="{{ $links.ask }}" target="_blank" rel="noopener noreferrer">Ask a question <span aria-hidden="true">↗</span></a>
{{ else }}
<a class="commentary-add" href="{{ $links.add | safeURL }}">Add commentary <span aria-hidden="true">↗</span></a>
{{ end }}
