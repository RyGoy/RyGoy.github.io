<article class="archive-entry{{ if .Params.post_id }} comment-entry{{ end }}" id="entry-{{ .Params.id }}" data-author="{{ .Params.from_name }}">
  {{ partial "lpPosts.html" . }}
  <footer class="entry-footer">
    {{ partial "lpGo.html" . }}
    <span class="entry-actions" data-pagefind-ignore>
      <button type="button" class="share-button" aria-live="polite">Share</button>
      <button type="button" class="copy-button" aria-live="polite">Copy</button>
    </span>
    {{ partial "entry-metadata.html" . }}
  </footer>
</article>
