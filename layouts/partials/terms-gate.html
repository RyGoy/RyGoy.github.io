{{/* Terms banner, shown 20 seconds after a visitor arrives (static/js/terms-gate.js). The text lives in content/terms.md; the version hash makes edits ask visitors to accept again. */}}
{{ with site.GetPage "/terms" }}
<script src="{{ "js/terms-gate.js" | relURL }}" data-terms="{{ .RelPermalink }}" data-version="{{ .Content | md5 }}"{{ with .Params.audio }} data-audio="{{ . | relURL }}"{{ end }} defer></script>
{{ end }}
