{{ if not .Params.post_id }}
  {{ $n := len .Pages }}
  {{ if $n }}
    <a class="comments-link" data-pagefind-ignore href="{{ .RelPermalink }}#comments" aria-label="Read {{ $n }} {{ cond (eq $n 1) "comment" "comments" }}">Read Comments <span class="comment-count" aria-hidden="true">{{ $n }}</span></a>
  {{ else }}
    <a class="comments-link is-empty" data-pagefind-ignore href="{{ .RelPermalink }}">No Comments <span class="comments-arrow" aria-hidden="true">↗</span></a>
  {{ end }}
{{ end }}
